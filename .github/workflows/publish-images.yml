name: Publish images

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      services:
        description: >-
          Comma-separated services to publish (e.g. identity-service,risk-ai-service),
          or "all"
        required: true
        default: all
        type: string

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Plan publish matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jvm: ${{ steps.plan.outputs.has_jvm }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICES_INPUT: ${{ github.event.inputs.services }}
        run: |
          ALL='[
            {"service":"identity-service","jvm":true},
            {"service":"account-service","jvm":true},
            {"service":"ledger-service","jvm":true},
            {"service":"transaction-orchestrator","jvm":true},
            {"service":"vault-service","jvm":true},
            {"service":"enclave-runtime","jvm":true},
            {"service":"ussd-gateway","jvm":true},
            {"service":"loan-service","jvm":true},
            {"service":"compliance-service","jvm":true},
            {"service":"risk-ai-service","jvm":false},
            {"service":"payment-hub","jvm":false},
            {"service":"notification-service","jvm":false}
          ]'
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$SERVICES_INPUT" = "all" ] || [ -z "$SERVICES_INPUT" ]; then
            matrix="$ALL"
          else
            matrix=$(SERVICES_INPUT="$SERVICES_INPUT" ALL="$ALL" python3 - <<'PY'
          import json, os
          wanted = {s.strip() for s in os.environ["SERVICES_INPUT"].split(",") if s.strip()}
          all_rows = json.loads(os.environ["ALL"])
          known = {r["service"] for r in all_rows}
          unknown = sorted(wanted - known)
          if unknown:
              raise SystemExit(f"Unknown services: {', '.join(unknown)}. Known: {', '.join(sorted(known))}")
          rows = [r for r in all_rows if r["service"] in wanted]
          if not rows:
              raise SystemExit("No services selected")
          print(json.dumps(rows))
          PY
            )
          fi
          has_jvm=$(python3 -c 'import json,sys; print(str(any(r["jvm"] for r in json.loads(sys.argv[1]))).lower())' "$matrix")
          echo "has_jvm=$has_jvm" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json,sys; print(json.dumps({"include": json.loads(sys.argv[1])}))' "$matrix")" >> "$GITHUB_OUTPUT"
          echo "Publishing matrix: $matrix"

  bootjars:
    name: Build JVM bootJars
    needs: plan
    if: needs.plan.outputs.has_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Resolve JVM modules to build
        id: jars
        env:
          MATRIX_JSON: ${{ needs.plan.outputs.matrix }}
        run: |
          tasks=$(python3 - <<'PY'
          import json, os
          rows = json.loads(os.environ["MATRIX_JSON"])["include"]
          print(" ".join(f":{r['service']}:bootJar" for r in rows if r["jvm"]))
          PY
          )
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Building: $tasks"

      - name: bootJar (selected Spring services)
        run: ./gradlew --no-daemon ${{ steps.jars.outputs.tasks }}

      # Stage under a directory with no wildcards. upload-artifact flattens paths
      # before the first `*`, so `services/*/build/libs/app.jar` would download as
      # `<service>/build/libs/app.jar` and break Dockerfile COPY paths.
      - name: Stage bootJars for artifact
        run: |
          mkdir -p bootjars-upload
          for jar in services/*/build/libs/app.jar; do
            [ -f "$jar" ] || continue
            dest="bootjars-upload/${jar}"
            mkdir -p "$(dirname "$dest")"
            cp -a "$jar" "$dest"
          done
          find bootjars-upload -type f -ls

      - uses: actions/upload-artifact@v4
        with:
          name: bootjars
          path: bootjars-upload
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.service }}
    needs: [plan, bootjars]
    if: always() && needs.plan.result == 'success' && (needs.bootjars.result == 'success' || needs.bootjars.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: matrix.jvm
        with:
          name: bootjars
          path: .

      - name: Verify JVM bootJar
        if: matrix.jvm
        run: |
          jar="services/${{ matrix.service }}/build/libs/app.jar"
          if [ ! -f "$jar" ]; then
            echo "Missing $jar"
            find . -name 'app.jar' -print || true
            exit 1
          fi
          ls -la "$jar"
          # Each bootJar is ~100MB+; drop the other services' jars so the
          # Docker context stays small on this matrix runner.
          find services -name 'app.jar' ! -path "services/${{ matrix.service }}/*" -delete
          # Drop the staging wrapper directory if present (keeps context lean).
          rm -rf bootjars-upload

      - name: Image name (lowercase)
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${owner}/${repo}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # provenance/sbom attestations are disabled: GHCR often returns
      # permission_denied/write_package (403) on the first package push when
      # build-push-action@v6 tries to upload attestation manifests.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
