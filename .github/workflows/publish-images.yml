name: Publish images

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  bootjars:
    name: Build JVM bootJars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: bootJar (all Spring services)
        run: |
          ./gradlew --no-daemon \
            :identity-service:bootJar \
            :account-service:bootJar \
            :ledger-service:bootJar \
            :transaction-orchestrator:bootJar \
            :vault-service:bootJar \
            :enclave-runtime:bootJar \
            :ussd-gateway:bootJar \
            :loan-service:bootJar \
            :compliance-service:bootJar

      - uses: actions/upload-artifact@v4
        with:
          name: bootjars
          path: services/*/build/libs/app.jar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.service }}
    needs: bootjars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - account-service
          - ledger-service
          - transaction-orchestrator
          - vault-service
          - enclave-runtime
          - ussd-gateway
          - loan-service
          - compliance-service
          - risk-ai-service
          - payment-hub
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootjars
          # Restores services/<svc>/build/libs/app.jar at repo root (matches Dockerfiles).

      - name: Verify JVM bootJars
        run: |
          for svc in identity-service account-service ledger-service transaction-orchestrator \
            vault-service enclave-runtime ussd-gateway loan-service compliance-service; do
            jar="services/${svc}/build/libs/app.jar"
            if [ ! -f "$jar" ]; then
              echo "Missing $jar"
              find . -name 'app.jar' -print || true
              exit 1
            fi
          done

      - name: Image name (lowercase)
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${owner}/${repo}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
