name: Publish images

# Second link in the chain: CI -> Publish images -> Deploy.
#
# This used to run on `push` in parallel with CI, so images could be published
# from a commit whose tests were still running — or had already failed. It now
# starts only after CI succeeds for that exact commit, and every image is tagged
# sha-<short> so a deploy can name one immutable artifact set.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  # Release tags do not run CI (it is branch-scoped), so they trigger directly.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      services:
        description: >-
          Comma-separated services to publish (e.g. identity-service,risk-ai-service),
          or "all"
        required: true
        default: all
        type: string

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Plan publish matrix
    # Never publish from a red CI run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jvm: ${{ steps.plan.outputs.has_jvm }}
      sha: ${{ steps.sha.outputs.sha }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      # On a workflow_run trigger, github.sha is the default branch head rather
      # than the commit CI actually verified. Everything downstream uses this.
      - id: sha
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${TRIGGER_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Publishing from $TRIGGER_SHA"

      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICES_INPUT: ${{ github.event.inputs.services }}
        run: |
          ALL='[
            {"service":"identity-service","jvm":true},
            {"service":"account-service","jvm":true},
            {"service":"ledger-service","jvm":true},
            {"service":"transaction-orchestrator","jvm":true},
            {"service":"vault-service","jvm":true},
            {"service":"enclave-runtime","jvm":true},
            {"service":"ussd-gateway","jvm":true},
            {"service":"loan-service","jvm":true},
            {"service":"compliance-service","jvm":true},
            {"service":"risk-ai-service","jvm":false},
            {"service":"payment-hub","jvm":false},
            {"service":"notification-service","jvm":false}
          ]'
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$SERVICES_INPUT" = "all" ] || [ -z "$SERVICES_INPUT" ]; then
            matrix="$ALL"
          else
            matrix=$(SERVICES_INPUT="$SERVICES_INPUT" ALL="$ALL" python3 - <<'PY'
          import json, os
          wanted = {s.strip() for s in os.environ["SERVICES_INPUT"].split(",") if s.strip()}
          all_rows = json.loads(os.environ["ALL"])
          known = {r["service"] for r in all_rows}
          unknown = sorted(wanted - known)
          if unknown:
              raise SystemExit(f"Unknown services: {', '.join(unknown)}. Known: {', '.join(sorted(known))}")
          rows = [r for r in all_rows if r["service"] in wanted]
          if not rows:
              raise SystemExit("No services selected")
          print(json.dumps(rows))
          PY
            )
          fi
          has_jvm=$(python3 -c 'import json,sys; print(str(any(r["jvm"] for r in json.loads(sys.argv[1]))).lower())' "$matrix")
          echo "has_jvm=$has_jvm" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json,sys; print(json.dumps({"include": json.loads(sys.argv[1])}))' "$matrix")" >> "$GITHUB_OUTPUT"
          echo "Publishing matrix: $matrix"

  bootjars:
    name: Build JVM bootJars
    needs: plan
    if: needs.plan.outputs.has_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Resolve JVM modules to build
        id: jars
        env:
          MATRIX_JSON: ${{ needs.plan.outputs.matrix }}
        run: |
          tasks=$(python3 - <<'PY'
          import json, os
          rows = json.loads(os.environ["MATRIX_JSON"])["include"]
          print(" ".join(f":{r['service']}:bootJar" for r in rows if r["jvm"]))
          PY
          )
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Building: $tasks"

      - name: bootJar (selected Spring services)
        run: ./gradlew --no-daemon ${{ steps.jars.outputs.tasks }}

      # Stage under a directory with no wildcards. upload-artifact flattens paths
      # before the first `*`, so `services/*/build/libs/app.jar` would download as
      # `<service>/build/libs/app.jar` and break Dockerfile COPY paths.
      - name: Stage bootJars for artifact
        run: |
          mkdir -p bootjars-upload
          for jar in services/*/build/libs/app.jar; do
            [ -f "$jar" ] || continue
            dest="bootjars-upload/${jar}"
            mkdir -p "$(dirname "$dest")"
            cp -a "$jar" "$dest"
          done
          find bootjars-upload -type f -ls

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootjars
          path: bootjars-upload
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.service }}
    needs: [plan, bootjars]
    if: always() && needs.plan.result == 'success' && (needs.bootjars.result == 'success' || needs.bootjars.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
      security-events: write
      # Required for the build provenance attestation.
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.jvm
        with:
          name: bootjars
          path: .

      - name: Verify JVM bootJar
        if: matrix.jvm
        run: |
          jar="services/${{ matrix.service }}/build/libs/app.jar"
          if [ ! -f "$jar" ]; then
            echo "Missing $jar"
            find . -name 'app.jar' -print || true
            exit 1
          fi
          ls -la "$jar"
          # Each bootJar is ~100MB+; drop the other services' jars so the
          # Docker context stays small on this matrix runner.
          find services -name 'app.jar' ! -path "services/${{ matrix.service }}/*" -delete
          # Drop the staging wrapper directory if present (keeps context lean).
          rm -rf bootjars-upload

      - name: Image name (lowercase)
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${owner}/${repo}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # sha- is written explicitly rather than through type=sha: on a
          # workflow_run trigger the sha context points at the branch head, not
          # the verified commit, and deploy.sh pins exactly this tag.
          tags: |
            type=raw,value=sha-${{ needs.plan.outputs.short_sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-enabled: these were disabled because GHCR returns 403 on the very
          # first push of a brand-new package, which no longer applies now that
          # every package exists. Each image now carries an SBOM and build
          # provenance, so what runs in production is inspectable
          # (`docker buildx imagetools inspect <image> --format '{{json .SBOM}}'`).
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Scans the artifact that will actually run, not the source tree — base
      # image CVEs surface only here.
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:sha-${{ needs.plan.outputs.short_sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload image scan
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@7e3036b9cd87fc26dd06747b7aa4b96c27aaef3a # codeql-bundle-v2.20.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}
          wait-for-processing: false
        continue-on-error: true
