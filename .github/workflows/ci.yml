name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  jvm:
    name: JVM verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Verify
        run: ./gradlew verify --no-daemon

      - name: Lite bundle budget
        run: bash scripts/check-lite-budget.sh

      - name: Collect detekt SARIF
        if: always()
        run: |
          mkdir -p build/detekt-sarif
          shopt -s nullglob
          for f in services/*/build/reports/detekt/detekt.sarif; do
            cp "$f" "build/detekt-sarif/$(basename "$(dirname "$(dirname "$(dirname "$f")")")").sarif"
          done

      - name: Upload detekt SARIF
        if: always() && hashFiles('build/detekt-sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/detekt-sarif
          wait-for-processing: false
        continue-on-error: true

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f infra/compose/docker-compose.yml --profile core config --quiet
