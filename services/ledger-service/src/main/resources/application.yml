server:
  port: 8084

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # db/kernel ships the transactional outbox from shared-kernel (ADR-0005).
    locations: classpath:db/migration,classpath:db/kernel
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:19092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/finix

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

finix:
  # Demo / local grading: endpoints are open until the gateway + Keycloak path is wired end-to-end.
  security:
    permit-all: true
  dpop:
    enabled: true
    required: false
  outbox:
    enabled: true
  anchor:
    interval-ms: 60000
    adapter: local

logging:
  level:
    org.finix.ledger: INFO
