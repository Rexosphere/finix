server:
  port: 8082

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/identity
    username: identity
    # No default: the password is supplied at runtime — a mounted Docker secret
    # (configtree) in compose, Vault where it runs, or this variable for a bare
    # `gradlew bootRun` against a local Postgres.
    password: ${FINIX_LOCAL_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Service migrations plus the shared-kernel outbox (classpath:db/kernel).
    locations: classpath:db/migration,classpath:db/kernel
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    vault:
      # ADR-0006. Off unless a Vault is running: locally the datasource password
      # arrives as a mounted Docker secret (configtree), and in the security/full
      # profile the same value is read from Vault, which vault-bootstrap seeded
      # from those very files — so the two sources cannot disagree.
      enabled: ${FINIX_VAULT_ENABLED:false}
      uri: ${FINIX_VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      # AppRole role-id/secret-id are supplied by a configtree import that is
      # listed before vault:// in spring.config.import.
      fail-fast: true
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/finix
      # No spring.security.oauth2.client block: AuthController does PKCE via RestClient
      # + finix.keycloak.*. A client issuer-uri of localhost:8081 fails inside Docker
      # (localhost is the identity container, not Keycloak on the host).

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

finix:
  keycloak:
    # Server-side token exchange (compose overrides to http://keycloak:8080).
    base-url: http://localhost:8081
    # Browser-facing authorize URL (must stay reachable from the user's machine).
    public-base-url: http://localhost:8081
    realm: finix
    client-id: finix-web
  # Local demo: allow unauthenticated calls until the web BFF wires cookies end-to-end.
  # Production compose overrides this to false.
  security:
    permit-all: true
  dpop:
    enabled: true
    required: false
