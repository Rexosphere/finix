server:
  port: 8083

spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/account
    username: account
    password: account
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/kernel
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:19092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/finix

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

finix:
  # Demo mode: local compose and seed scripts call the API without bearer tokens.
  # Production / CI with real clients must set this to false.
  security:
    permit-all: true
  dpop:
    enabled: true
    required: false
  outbox:
    enabled: true
  idempotency:
    enabled: true
  offline:
    max-duration-hours: 72
    max-per-tx-minor: 500000
    max-cumulative-minor: 2500000
    max-queued: 20
    reconciliation-window-hours: 168

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
