server:
  port: 8086

spring:
  application:
    name: vault-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/vault
    username: vault_svc
    password: vault_svc
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/finix

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

finix:
  security:
    permit-all: true
  dpop:
    enabled: true
    required: false
  enclave:
    # Reconstruct always crosses the process boundary — that isolation is the point of the
    # ceremony, so there is no in-process enclave adapter to fall back to.
    mode: remote
    base-url: http://localhost:8090

logging:
  level:
    org.finix.vault: INFO
