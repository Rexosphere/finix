server:
  port: 8086

spring:
  application:
    name: vault-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/vault
    username: vault_svc
    # No default: the password is supplied at runtime — a mounted Docker secret
    # (configtree) in compose, Vault where it runs, or this variable for a bare
    # `gradlew bootRun` against a local Postgres.
    password: ${FINIX_LOCAL_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    vault:
      # ADR-0006. Off unless a Vault is running: locally the datasource password
      # arrives as a mounted Docker secret (configtree), and in the security/full
      # profile the same value is read from Vault, which vault-bootstrap seeded
      # from those very files — so the two sources cannot disagree.
      enabled: ${FINIX_VAULT_ENABLED:false}
      uri: ${FINIX_VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      # AppRole role-id/secret-id are supplied by a configtree import that is
      # listed before vault:// in spring.config.import.
      fail-fast: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/finix

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

finix:
  security:
    permit-all: true
  dpop:
    enabled: true
    required: false
  enclave:
    # Reconstruct always crosses the process boundary — that isolation is the point of the
    # ceremony, so there is no in-process enclave adapter to fall back to.
    mode: remote
    base-url: http://localhost:8090

logging:
  level:
    org.finix.vault: INFO
