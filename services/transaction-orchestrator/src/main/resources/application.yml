server:
  port: 8085

spring:
  application:
    name: transaction-orchestrator
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/orchestrator
    username: orchestrator
    # No default: the password is supplied at runtime — a mounted Docker secret
    # (configtree) in compose, Vault where it runs, or this variable for a bare
    # `gradlew bootRun` against a local Postgres.
    password: ${FINIX_LOCAL_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/kernel
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:19092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/finix

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

finix:
  account:
    base-url: http://localhost:8083
  ledger:
    base-url: http://localhost:8084
  risk:
    base-url: http://localhost:8091
  # Demo mode: local compose and chaos scripts call the API without bearer tokens.
  security:
    permit-all: true
  dpop:
    enabled: true
    required: false
  outbox:
    enabled: true
  idempotency:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
