build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 14
    ignoreDefaultParameters: true
    # Persistence rehydrate / attestation builders mirror table columns.
    excludes: ['**/domain/**']
  TooManyFunctions:
    active: true
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInFiles: 20
    ignorePrivate: true
    ignoreOverridden: true
  LongMethod:
    active: true
    threshold: 100
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  NestedBlockDepth:
    active: true
    threshold: 6

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    excludes: ['**/adapter/**', '**/usecase/**']
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    excludes: ['**/test/**', '**/integrationTest/**']
  TopLevelPropertyNaming:
    active: true
  MatchingDeclarationName:
    active: true
  InvalidPackageDeclaration:
    active: true
    excludes: ['**/adapter/in/**']
  # Wire DTOs intentionally mirror Nitro/JSON snake_case field names.
  ConstructorParameterNaming:
    active: true
    excludes: ['**/adapter/in/rest/**', '**/dto/**']

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentStatements: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreNumbers: ['-1', '0', '1', '2', '3', '5', '8', '12', '16', '32', '64', '128', '255', '256']
    excludes:
      - '**/test/**'
      - '**/integrationTest/**'
      - '**/crypto/**'
      - '**/HybridSeal.kt'
      - '**/LocalAnchorAdapter.kt'
      - '**/SplitMasterKeyUseCase.kt'
      - '**/JpaCeremonyRepository.kt'
  ReturnCount:
    active: true
    max: 4
  ThrowsCount:
    active: true
    max: 8
    excludes: ['**/adapter/**', '**/usecase/**']
  ForbiddenComment:
    active: true
    comments:
      - reason: "Unresolved work must be an issue, not a comment."
        value: 'FIXME:'
      - reason: "Unresolved work must be an issue, not a comment."
        value: 'STOPSHIP:'
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: true
    excludeImports: ['java.util.*']

performance:
  SpreadOperator:
    active: true
    excludes: ['**/*Application.kt']

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  ImplicitDefaultLocale:
    active: true
  LateinitUsage:
    active: true
    excludes: ['**/test/**', '**/integrationTest/**']

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
