---
- name: Check for an existing application checkout
  ansible.builtin.stat:
    path: "{{ finix_app_dir }}/.git"
  register: finix_checkout

- name: Create state directory
  ansible.builtin.file:
    path: "{{ finix_state_dir }}"
    state: directory
    mode: "0755"

- name: Ensure the application checkout exists
  ansible.builtin.git:
    repo: "{{ finix_repo_url }}"
    dest: "{{ finix_app_dir }}"
    version: HEAD
    force: true
  become_user: "{{ finix_user }}"
  # Only clones when the directory is absent. A provisioned host is normally
  # detached at a released commit (deploy.sh puts it there), and provisioning
  # must not silently roll production forward to a newer master.
  when: not finix_checkout.stat.exists

# Credentials are generated on the host and never leave it (ADR-0006). The
# script only creates what is missing, so re-running the playbook cannot
# invalidate the Postgres roles created from these files.
#
# Generated as the deploy user, not root: deploy.sh runs unprivileged over SSH
# and checks these files before it will start anything, so a root-owned 0700
# directory makes every deploy fail with "Missing secrets".
- name: Generate any missing secrets
  ansible.builtin.command: "{{ finix_app_dir }}/scripts/gen-secrets.sh"
  become_user: "{{ finix_user }}"
  register: gen_secrets
  changed_when: "'Generated' in gen_secrets.stdout"

- name: Ensure the secrets directory belongs to the deploy user
  ansible.builtin.file:
    path: "{{ finix_app_dir }}/infra/compose/secrets"
    state: directory
    owner: "{{ finix_user }}"
    group: "{{ finix_user }}"
    mode: "0700"
    recurse: false

- name: Write the environment file consumed by compose
  ansible.builtin.template:
    src: finix.env.j2
    dest: "{{ finix_state_dir }}/finix.env"
    # Readable by the deploy user: deploy.sh passes it to compose with
    # --env-file, and compose reads it as whoever invoked it, not as root.
    owner: "{{ finix_user }}"
    group: "{{ finix_user }}"
    mode: "0640"

- name: Install the Postgres backup script
  ansible.builtin.template:
    src: backup-db.sh.j2
    dest: "{{ finix_state_dir }}/backup-db.sh"
    mode: "0755"

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ finix_state_dir }}/backups"
    state: directory
    mode: "0700"

- name: Install the backup service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/finix-backup.service
    mode: "0644"
    content: |
      [Unit]
      Description=FINIX nightly Postgres backup
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart={{ finix_state_dir }}/backup-db.sh
  notify: Reload systemd

- name: Install the backup timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/finix-backup.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Run the FINIX Postgres backup nightly

      [Timer]
      OnCalendar=*-*-* {{ finix_backup_hour }}:00
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Enable the backup timer
  ansible.builtin.systemd:
    name: finix-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Keep a convenience symlink for the old deploy path
  ansible.builtin.file:
    src: "{{ finix_app_dir }}/infra/deploy/deploy.sh"
    dest: "{{ finix_state_dir }}/deploy.sh"
    state: link
    force: true
