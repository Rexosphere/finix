---
- name: Set hostname
  ansible.builtin.hostname:
    name: finix

# Only ansible.builtin is used anywhere in this playbook, so a bare host needs
# ansible-core and nothing else — no collection install step to get wrong.
- name: Read current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_tz
  changed_when: false

- name: Set timezone to UTC
  ansible.builtin.command: timedatectl set-timezone UTC
  when: current_tz.stdout != 'UTC'

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - make
      - ufw
      - unattended-upgrades
      - python3
      # deb822_repository (used by the docker and caddy roles) needs it.
      - python3-debian
      - jq
    state: present
    update_cache: true
    cache_valid_time: 3600

# Deliberately no JDK: nothing is built on this host any more (ADR-0007).

- name: Create swap file
  ansible.builtin.command: fallocate -l 4G /swapfile
  args:
    creates: /swapfile

- name: Secure swap file
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Format swap file
  ansible.builtin.command: mkswap /swapfile
  register: mkswap
  changed_when: "'Setting up swapspace' in mkswap.stdout"
  failed_when: mkswap.rc != 0 and 'Device or resource busy' not in mkswap.stderr

- name: Enable swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0
    state: present

- name: Activate swap
  ansible.builtin.command: swapon /swapfile
  register: swapon
  changed_when: swapon.rc == 0
  failed_when: swapon.rc != 0 and 'already active' not in swapon.stderr

# Key injection stays the cloud provider's job; this only closes the doors.
- name: Harden sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: sshd -t -f %s
  loop:
    - { regexp: '^#?PasswordAuthentication', line: PasswordAuthentication no }
    - { regexp: '^#?PermitRootLogin', line: PermitRootLogin prohibit-password }
    - { regexp: '^#?PermitEmptyPasswords', line: PermitEmptyPasswords no }
  notify: Reload sshd

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51finix-unattended
    mode: "0644"
    content: |
      // Security updates apply automatically; reboots stay a human decision so
      // a kernel update never takes the demo down mid-judging.
      Unattended-Upgrade::Automatic-Reboot "false";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Start unattended-upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started
