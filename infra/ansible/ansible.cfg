[defaults]
inventory = inventory/production.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# `stdout_callback = yaml` resolved to community.general.yaml, which was removed
# in community.general 12 / ansible-core 2.20. The built-in default callback with
# result_format=yaml is the documented replacement and needs no collection.
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
