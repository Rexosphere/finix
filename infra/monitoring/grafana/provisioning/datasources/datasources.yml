apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: finix-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: finix-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Clicking a trace id in a log line jumps straight to the metrics
      # view for that service; the JVM services already emit `service`.
      derivedFields:
        - name: TraceID
          matcherRegex: "traceId=(\\w+)"
          url: "$${__value.raw}"
