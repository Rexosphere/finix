#cloud-config
# FINIX single-server deploy — Ubuntu 26.04, 32GB RAM.
#
# Profile:   full (core + Vault + OPA)
# Source:    build from source (JDK 21 + Gradle, no GHCR pull)
# Exposure:  Caddy reverse proxy + Let's Encrypt TLS on:
#              https://roboti.qzz.io        -> web (3000)
#              https://admin.roboti.qzz.io  -> admin (3001)
#              https://auth.roboti.qzz.io   -> keycloak (8081)
#            Every other container port (postgres, redis, redpanda, vault,
#            opa, and every backend service 8082-8093) is firewalled off
#            from the public internet via ufw-docker and reachable only
#            from the host itself.
# SSH:       relies on the cloud provider's own key injection; this file
#            only hardens sshd (no password auth, no root login).
#
# BEFORE BOOTING THIS SERVER:
#   - Point A/AAAA records for roboti.qzz.io, admin.roboti.qzz.io and
#     auth.roboti.qzz.io at this server's public IP (Caddy needs that to
#     issue certs — it will retry harmlessly until DNS resolves).
#   - Give the root volume real headroom: building ~9 JVM services plus
#     pulling/building ~15 container images (postgres, redis, redpanda,
#     keycloak, vault, opa, python/node/go base images, ...) easily uses
#     30-40GB between Gradle caches and Docker images. 60GB+ recommended.
#
# KNOWN APP LIMITATION NOT FIXED HERE (flagged, not silently patched):
#   apps/admin/index.html:178 calls the vault-service API via a hardcoded
#   `http://localhost:8086` instead of the same-origin `/api/vault/` path
#   that apps/admin/nginx.conf already proxies. On this deployment that
#   makes the admin ceremony page fail for anyone except someone browsing
#   from the server itself. Ask about fixing that in the app before relying
#   on the ceremony UI remotely.

hostname: finix
timezone: UTC

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - make
  - ufw
  - unattended-upgrades
  - openjdk-21-jdk

write_files:
  # --- Caddy: TLS termination + reverse proxy to the three public front doors ---
  - path: /etc/caddy/Caddyfile
    owner: root:root
    permissions: "0644"
    content: |
      {
        email suhasdissa@gmail.com
      }

      roboti.qzz.io {
        reverse_proxy 127.0.0.1:3000
      }

      admin.roboti.qzz.io {
        reverse_proxy 127.0.0.1:3001
      }

      auth.roboti.qzz.io {
        reverse_proxy 127.0.0.1:8081
      }

      # Grafana binds 127.0.0.1:3002 only; this is its sole public door.
      grafana.roboti.qzz.io {
        reverse_proxy 127.0.0.1:3002
      }

  # --- Compose override: point Keycloak's issuer/hostname at the real domain ---
  # Ports are intentionally left alone here: docker's own iptables rules
  # bypass ufw, so port exposure is handled by ufw-docker below, not by
  # rewriting `ports:` (list-type compose keys concatenate across -f files
  # rather than replace, so trying to "override" ports here wouldn't
  # actually remove the original public bindings).
  - path: /opt/finix/docker-compose.override.yml
    owner: root:root
    permissions: "0644"
    content: |
      services:
        keycloak:
          environment:
            KC_HOSTNAME: https://auth.roboti.qzz.io
            KC_PROXY_HEADERS: xforwarded

        identity-service:
          environment:
            FINIX_KEYCLOAK_PUBLIC_BASE_URL: https://auth.roboti.qzz.io
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix
            SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

        account-service:
          environment:
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

        ledger-service:
          environment:
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

        transaction-orchestrator:
          environment:
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

        vault-service:
          environment:
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

        ussd-gateway:
          environment:
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

        loan-service:
          environment:
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

        compliance-service:
          environment:
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.roboti.qzz.io/realms/finix

  # --- Grafana credentials, consumed by ${...} interpolation in the compose file ---
  # Kept out of the compose override on purpose: interpolation variables do
  # not require the `grafana` service to exist yet, so this file is harmless
  # if it lands before the monitoring profile does. A service-level override
  # would instead fail the whole `docker compose config`.
  #
  # CHANGE THE PASSWORD after provisioning — Grafana is publicly reachable.
  - path: /opt/finix/monitoring.env
    owner: finix:finix
    permissions: "0600"
    content: |
      FINIX_GRAFANA_ADMIN_USER=admin
      FINIX_GRAFANA_ADMIN_PASSWORD=change-me-before-first-boot
      FINIX_GRAFANA_ROOT_URL=https://grafana.roboti.qzz.io

  # --- Docker log rotation (unbounded json-file logs will fill the disk otherwise) ---
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

  # --- Deploy script: builds all JVM jars, brings up the full profile, seeds personas ---
  - path: /opt/finix/deploy.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      REPO_URL="https://github.com/Rexosphere/finix.git"
      APP_DIR="/opt/finix/app"
      COMPOSE=(docker compose \
        --env-file /opt/finix/monitoring.env \
        -f "$APP_DIR/infra/compose/docker-compose.yml" \
        -f /opt/finix/docker-compose.override.yml \
        --profile full)
      export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-finix}"

      if [ -d "$APP_DIR/.git" ]; then
        echo "==> Repo already present, resetting to origin"
        # The sed below rewrites tracked HTML in place, so this working tree is
        # always dirty by the time the next deploy runs. `git pull --ff-only`
        # then aborts the moment an incoming commit touches one of those files.
        # This checkout is a build artifact, never an editing surface, so
        # discard local state outright rather than trying to merge into it.
        git -C "$APP_DIR" fetch --prune origin
        git -C "$APP_DIR" reset --hard "@{u}"
      else
        echo "==> Cloning $REPO_URL"
        git clone "$REPO_URL" "$APP_DIR"
      fi
      cd "$APP_DIR"

      # Cross-links in the static apps hardcode http://localhost:3000 / :3001
      # nav URLs — rewrite them to the real public hosts so the web<->admin
      # nav links work from a real browser instead of only from this host.
      sed -i \
        -e 's#http://localhost:3000#https://roboti.qzz.io#g' \
        -e 's#http://localhost:3001#https://admin.roboti.qzz.io#g' \
        apps/web/index.html apps/web/sme.html apps/admin/index.html

      echo "==> Building JVM services"
      ./gradlew \
        :identity-service:bootJar \
        :account-service:bootJar \
        :ledger-service:bootJar \
        :transaction-orchestrator:bootJar \
        :vault-service:bootJar \
        :enclave-runtime:bootJar \
        :ussd-gateway:bootJar \
        :loan-service:bootJar \
        :compliance-service:bootJar \
        -q

      echo "==> Starting compose (full profile)"
      "${COMPOSE[@]}" up -d --build

      # web/admin bind-mount a single nginx.conf file. `git reset --hard`
      # replaces that file rather than editing it in place, so the container
      # keeps the old inode and an nginx config change would silently never
      # take effect. Compose will not recreate them on its own either, since
      # the mount spec is unchanged.
      echo "==> Recreating static app containers so nginx picks up config changes"
      "${COMPOSE[@]}" up -d --force-recreate --no-deps web admin

      echo "==> Waiting for health"
      for entry in identity-service:8082 account-service:8083 ledger-service:8084 transaction-orchestrator:8085; do
        svc="${entry%%:*}"; port="${entry##*:}"
        echo -n "  $svc "
        for i in $(seq 1 60); do
          if curl -sf "http://localhost:${port}/actuator/health" >/dev/null 2>&1; then
            echo "ok"; break
          fi
          if [ "$i" -eq 60 ]; then
            echo "TIMEOUT"; "${COMPOSE[@]}" logs --tail=80 "$svc" || true; exit 1
          fi
          sleep 2
        done
      done

      ./scripts/seed.sh

      cat <<EOF

      FINIX is up.

        Web PWA / lite   https://roboti.qzz.io
        Admin ceremony   https://admin.roboti.qzz.io
        Keycloak admin   https://auth.roboti.qzz.io  (admin / admin)

      Demo users (password: Finix!2026 for all):
        farmer@finix.lk, sme@finix.lk, elder@finix.lk, regulator@finix.lk

      Everything else (postgres, redis, redpanda, vault, opa, and every
      backend service on 8082-8093) is reachable only from this host.
      EOF

runcmd:
  # --- swap: safety net for the Gradle build even with 32GB RAM ---
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # --- sshd hardening (key injection is left to the cloud provider) ---
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - systemctl reload ssh

  # --- Docker Engine (official repo) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture)
    signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" >
    /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # --- Caddy (official repo) ---
  - apt-get install -y debian-keyring debian-archive-keyring apt-transport-https
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' -o /etc/apt/keyrings/caddy.asc
  - >
    echo "deb [signed-by=/etc/apt/keyrings/caddy.asc]
    https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main" >
    /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy
  - systemctl enable --now caddy
  - systemctl restart caddy

  # --- ufw-docker: makes ufw's default-deny actually apply to docker's
  #     published ports (plain ufw is bypassed by docker's own iptables
  #     rules, so without this every container port would stay public
  #     regardless of ufw allow/deny rules) ---
  - curl -fsSL https://github.com/chaifeng/ufw-docker/raw/master/ufw-docker -o /usr/local/bin/ufw-docker
  - chmod +x /usr/local/bin/ufw-docker
  - ufw-docker install
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw --force enable
  - systemctl restart docker

  # --- unattended security upgrades, no surprise reboots ---
  - echo 'Unattended-Upgrade::Automatic-Reboot "false";' >> /etc/apt/apt.conf.d/50unattended-upgrades
  - systemctl enable --now unattended-upgrades

  # --- build + start FINIX (full profile) ---
  - bash /opt/finix/deploy.sh 2>&1 | tee /var/log/finix-deploy.log

final_message: "FINIX cloud-init done in $UPTIME s. Check /var/log/finix-deploy.log and /var/log/cloud-init-output.log if the stack isn't up yet."
