#cloud-config
# FINIX single-server bootstrap — Ubuntu 24.04/26.04.
#
# This file used to be the whole deployment: 300 lines of packages, Caddyfile,
# firewall rules, an inline deploy script and a compose override that existed
# nowhere else. All of that ran exactly once, at first boot, and could never be
# re-applied without rebuilding the machine.
#
# It is now a bootstrap and nothing more: install git and Ansible, then hand over
# to infra/ansible/, which is idempotent and lives in the repository. Re-running
# it converges the host instead of reinstalling it:
#
#   cd /opt/finix/repo && ansible-pull -U <repo> -d /opt/finix/repo \
#     -i infra/ansible/inventory/localhost.yml infra/ansible/site.yml
#
# BEFORE BOOTING THIS SERVER:
#   - Point A/AAAA records for the four hostnames in
#     infra/ansible/inventory/localhost.yml at this server's public IP. Caddy
#     retries harmlessly until DNS resolves.
#   - 40GB+ root volume: ~15 container images, backups and Docker's own state.
#     (The old build-on-server model needed 60GB+ for Gradle caches; deploying
#     published images removed that — see ADR-0007.)
#
# The application is NOT deployed here. Provisioning prepares the host; the
# Deploy workflow moves a release onto it, pinned to a commit SHA.

hostname: finix
timezone: UTC

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - python3
  - python3-pip
  - ansible

runcmd:
  - [git, clone, "https://github.com/Rexosphere/finix.git", /opt/finix/repo]
  - >
    ansible-playbook
    -i /opt/finix/repo/infra/ansible/inventory/localhost.yml
    /opt/finix/repo/infra/ansible/site.yml
    2>&1 | tee /var/log/finix-provision.log

final_message: >-
  FINIX host provisioned in $UPTIME s. Check /var/log/finix-provision.log.
  Deploy a release with the Deploy workflow, or on this host:
  /opt/finix/app/infra/deploy/deploy.sh <sha>
