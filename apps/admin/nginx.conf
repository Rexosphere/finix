server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/vault/ {
    proxy_pass http://vault-service:8086/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/orchestrator/ {
    proxy_pass http://transaction-orchestrator:8085/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/risk/ {
    proxy_pass http://risk-ai-service:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/compliance/ {
    proxy_pass http://compliance-service:8089/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/loan/ {
    proxy_pass http://loan-service:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/notify/ {
    proxy_pass http://notification-service:8093/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/pay/ {
    proxy_pass http://payment-hub:8092/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
