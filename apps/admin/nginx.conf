server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Without an explicit resolver, nginx resolves each
  # upstream name once at startup and caches that address for the life of the
  # process. A deploy that recreates a backend gives it a new container IP,
  # and this proxy keeps dialling the old one — which by then may belong to an
  # entirely different container — until nginx itself is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Passing the upstream through a variable defers resolution to request time,
  # which is the whole point of the resolver above. It also switches off
  # nginx's implicit "strip the matched prefix" rewriting, so each location
  # captures the remainder of the path and appends it explicitly.
  location ~ ^/api/vault/(.*)$ {
    set $upstream_vault http://vault-service:8086;
    proxy_pass $upstream_vault/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/orchestrator/(.*)$ {
    set $upstream_orchestrator http://transaction-orchestrator:8085;
    proxy_pass $upstream_orchestrator/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/risk/(.*)$ {
    set $upstream_risk http://risk-ai-service:8091;
    proxy_pass $upstream_risk/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/compliance/(.*)$ {
    set $upstream_compliance http://compliance-service:8089;
    proxy_pass $upstream_compliance/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/loan/(.*)$ {
    set $upstream_loan http://loan-service:8088;
    proxy_pass $upstream_loan/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/notify/(.*)$ {
    set $upstream_notify http://notification-service:8093;
    proxy_pass $upstream_notify/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/pay/(.*)$ {
    set $upstream_pay http://payment-hub:8092;
    proxy_pass $upstream_pay/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
