      <h1 class="headline-xl">Receipt verification</h1>

      </p>

      <section class="panel mesh-glow" style="margin-top:1.5rem">

  <script src="/env.js"></script>
  <script src="/js/finix.js"></script>
  <script type="module">
    Finix.bindMeshStatus("#meshStatus");

    async function sha256Hex(...chunks) {
      const total = chunks.reduce((n, c) => n + c.length, 0);
      const buf = new Uint8Array(total);
      let o = 0;
      for (const c of chunks) { buf.set(c, o); o += c.length; }
      const dig = await crypto.subtle.digest("SHA-256", buf);
      return [...new Uint8Array(dig)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function unhex(h) {
      const out = new Uint8Array(h.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(h.slice(i * 2, i * 2 + 2), 16);
      return out;
    }

    async function verifyMerkle(proof) {
      if (!proof.merkleRoot || proof.leafIndex == null) return { ok: false, reason: "No anchor yet for this entry" };
      let computed = await sha256Hex(new Uint8Array([0x00]), unhex(proof.entryHash));
      for (const step of proof.merklePath || []) {
        const sib = unhex(step.siblingHash);
        const cur = unhex(computed);
        computed = step.isLeftSibling
          ? await sha256Hex(new Uint8Array([0x01]), sib, cur)
          : await sha256Hex(new Uint8Array([0x01]), cur, sib);
      }
      return { ok: computed === proof.merkleRoot, computed, root: proof.merkleRoot };
    }

    function banner(kind, title, detail) {
      const status = document.getElementById("status");
      status.className = "status-banner " + kind;
      status.classList.remove("hidden");
      status.innerHTML = `<span class="material-symbols-outlined">${kind === "ok" ? "verified" : "gpp_bad"}</span>
        <div><strong>${title}</strong><div style="margin-top:0.25rem">${detail || ""}</div></div>`;
    }

    async function run(withProof) {
      const base = document.getElementById("base").value.replace(/\/$/, "");
      const tx = document.getElementById("tx").value.trim();
      const out = document.getElementById("out");
      try {
        const verify = await fetch(`${base}/api/v1/ledger/verify`).then(async (r) => {
          const t = await r.text();
          if (!r.ok) throw new Error(Finix.friendlyError(t || r.status));
          return JSON.parse(t);
        });
        let proof = null;
        let merkle = null;
        if (withProof && tx) {
          proof = await fetch(`${base}/api/v1/ledger/proof/${tx}`).then(async (r) => {
            const t = await r.text();
            if (!r.ok) throw new Error(Finix.friendlyError(t || r.status));
            return JSON.parse(t);
          });
          merkle = await verifyMerkle(proof);
        }
        const ok = verify.valid && (!merkle || merkle.ok);
        banner(
          ok ? "ok" : "err",
          ok ? "Ledger integrity OK" : "Verification failed",
          merkle
            ? (merkle.ok ? "Chain valid · Merkle inclusion OK" : (merkle.reason || "Merkle mismatch"))
            : (verify.valid ? "Hash chain valid" : `Break at ${verify.firstBreakSequence ?? "?"}`),
        );
        out.textContent = JSON.stringify({ chain: verify, proof, merkle }, null, 2);
        Finix.toast(ok ? "Verification passed" : "Verification failed", ok ? "ok" : "err");
      } catch (e) {
        const msg = Finix.friendlyError(e);
        banner("err", "Could not reach ledger", msg);
        out.textContent = msg;
        Finix.toast("Ledger API offline", "err");
      }
    }

    document.getElementById("go").onclick = () => run(true);
    document.getElementById("chainOnly").onclick = () => run(false);
  </script>
