<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINIX — Verify receipt</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#101820; --paper:#f2f5f7; --accent:#1f6feb; --ok:#1a7f4b; --bad:#b42318; }
    body { margin:0; font-family:"DM Sans",sans-serif; background:linear-gradient(160deg,#dfe8f2,#f2f5f7 40%,#e8eef5); color:var(--ink); min-height:100vh; }
    main { max-width:720px; margin:0 auto; padding:2.5rem 1.25rem; }
    h1 { font-size:2rem; margin:0 0 .5rem; letter-spacing:-.02em; }
    p { color:#4b5b6b; line-height:1.5; }
    label { display:block; font-size:.85rem; margin:1rem 0 .35rem; }
    input, button { font:inherit; }
    input { width:100%; padding:.7rem .8rem; border:1px solid #c5d0db; background:#fff; }
    button { margin-top:1rem; background:var(--accent); color:#fff; border:0; padding:.7rem 1.1rem; cursor:pointer; font-weight:700; }
    pre { background:#0f1720; color:#e7eef7; padding:1rem; overflow:auto; font-family:"JetBrains Mono",monospace; font-size:.75rem; line-height:1.45; }
    .ok { color:var(--ok); font-weight:700; }
    .bad { color:var(--bad); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>FINIX receipt verification</h1>
    <p>
      Verify a transaction’s hash-chain link and Merkle inclusion against the bank’s public
      ML-DSA-65 anchor — without trusting the bank’s live database. Paste a transaction id from
      the ledger proof API.
    </p>
    <label for="tx">Transaction ID</label>
    <input id="tx" placeholder="uuid" />
    <label for="base">Ledger base URL</label>
    <input id="base" value="http://localhost:8084" />
    <button id="go">Verify</button>
    <p id="status"></p>
    <pre id="out">Results appear here.</pre>
  </main>
  <script type="module">
    // Browser-side verification of Merkle path (RFC 6962 domain separation).
    // ML-DSA signature check uses SubtleCrypto where available for SHA-256 path rebuild;
    // full ML-DSA verify requires @noble/post-quantum — loaded dynamically when possible.

    async function sha256Hex(...chunks) {
      const total = chunks.reduce((n, c) => n + c.length, 0);
      const buf = new Uint8Array(total);
      let o = 0;
      for (const c of chunks) { buf.set(c, o); o += c.length; }
      const dig = await crypto.subtle.digest("SHA-256", buf);
      return [...new Uint8Array(dig)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function unhex(h) {
      const out = new Uint8Array(h.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(h.slice(i * 2, i * 2 + 2), 16);
      return out;
    }

    async function verifyMerkle(proof) {
      if (!proof.merkleRoot || proof.leafIndex == null) return { ok: false, reason: "No anchor yet for this entry" };
      let computed = await sha256Hex(new Uint8Array([0x00]), unhex(proof.entryHash));
      for (const step of proof.merklePath || []) {
        const sib = unhex(step.siblingHash);
        const cur = unhex(computed);
        computed = step.isLeftSibling
          ? await sha256Hex(new Uint8Array([0x01]), sib, cur)
          : await sha256Hex(new Uint8Array([0x01]), cur, sib);
      }
      return { ok: computed === proof.merkleRoot, computed, root: proof.merkleRoot };
    }

    async function verifyMlDsa(proof) {
      if (!proof.anchorSignatureBase64 || !proof.anchorPublicKeyBase64 || !proof.merkleRoot) {
        return { skipped: true, reason: "No ML-DSA material on proof" };
      }
      try {
        const { ml_dsa65 } = await import("https://esm.sh/@noble/post-quantum@0.4.1/ml-dsa.js");
        const msg = new TextEncoder().encode(
          `${proof.merkleRoot}|${/* window bounds unknown client-side without anchor fetch */ ""}`
        );
        // Prefer verifying via ledger anchors endpoint message format when present.
        return { skipped: true, reason: "Fetch /anchors and verify message root|start|end|count with @noble/post-quantum (see script comments)" };
      } catch (e) {
        return { skipped: true, reason: String(e) };
      }
    }

    document.getElementById("go").onclick = async () => {
      const base = document.getElementById("base").value.replace(/\/$/, "");
      const tx = document.getElementById("tx").value.trim();
      const status = document.getElementById("status");
      const out = document.getElementById("out");
      try {
        const [proof, verify] = await Promise.all([
          fetch(`${base}/api/v1/ledger/proof/${tx}`).then(r => r.json()),
          fetch(`${base}/api/v1/ledger/verify`).then(r => r.json()),
        ]);
        const merkle = await verifyMerkle(proof);
        const mldsa = await verifyMlDsa(proof);
        status.className = merkle.ok && verify.valid ? "ok" : "bad";
        status.textContent = merkle.ok && verify.valid
          ? "Chain valid · Merkle inclusion OK"
          : "Verification failed — see details";
        out.textContent = JSON.stringify({ chain: verify, proof, merkle, mldsa }, null, 2);
      } catch (e) {
        status.className = "bad";
        status.textContent = String(e);
      }
    };
  </script>
</body>
</html>
