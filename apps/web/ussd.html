<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINIX — USSD *334#</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="/" class="brand">FINIX</a>
        <div class="topbar-actions">
          <span class="mesh-pill" id="meshStatus"><span class="dot"></span> Mesh Active</span>
          <nav class="nav-links">
            <a href="/">Identity</a>
            <a href="/transfer.html">Send</a>
            <a href="/offline.html">Offline</a>
            <a class="active" href="/ussd.html">USSD</a>
            <a href="/lite.html">Lite</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="page container page-enter" style="max-width:720px">
      <h1 class="headline-xl">USSD *334#</h1>
      <p class="lede">Phone-menu banking over the real Africa's Talking <span class="data-md">POST /ussd</span> contract.</p>

      <section class="panel mesh-glow" style="margin-top:1.25rem">
        <div class="actions" style="margin:0 0 1rem">
          <label class="field" style="flex:1;min-width:200px">
            <span class="cap">Phone</span>
            <select id="phone">
              <option value="+94771110001">+94771110001 Farmer</option>
              <option value="+94771110002">+94771110002 SME</option>
              <option value="+94771110003">+94771110003 Elder</option>
            </select>
          </label>
          <button class="btn btn-primary" id="dial" type="button" style="align-self:end">
            <span class="material-symbols-outlined">call</span> Dial *334#
          </button>
          <button class="btn btn-secondary" id="reset" type="button" style="align-self:end">End</button>
        </div>

        <div class="ussd-screen" id="screen">Press Dial to start.</div>
        <div class="keys" id="keys" hidden>
          <button class="btn btn-secondary" data-k="1" type="button">1</button>
          <button class="btn btn-secondary" data-k="2" type="button">2</button>
          <button class="btn btn-secondary" data-k="3" type="button">3</button>
          <button class="btn btn-secondary" data-k="4" type="button">4</button>
          <button class="btn btn-secondary" data-k="5" type="button">5</button>
          <button class="btn btn-secondary" data-k="6" type="button">6</button>
          <button class="btn btn-secondary" data-k="7" type="button">7</button>
          <button class="btn btn-secondary" data-k="8" type="button">8</button>
          <button class="btn btn-secondary" data-k="9" type="button">9</button>
          <button class="btn btn-secondary" data-k="*" type="button">*</button>
          <button class="btn btn-secondary" data-k="0" type="button">0</button>
          <button class="btn btn-primary" data-k="send" type="button">OK</button>
        </div>
        <input id="buffer" placeholder="type amount / choice then OK" style="margin-top:0.85rem" />
        <p class="label-caps" style="margin-top:1rem">1 Balance · 2 Send · 3 Statement · 4 Loan · 5 Language</p>
        <div id="ussdHint" class="status-banner hidden" style="margin-top:1rem"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="label-caps" style="color:var(--on-surface);margin:0">FINIX Mesh · USSD gateway</p>
    </footer>
  </div>
  <script src="/js/finix.js"></script>
  <script>
    Finix.bindMeshStatus("#meshStatus");
    const USSD_BASE = Finix.API.ussd();
    const screen = document.getElementById("screen");
    const keys = document.getElementById("keys");
    const buffer = document.getElementById("buffer");
    const hint = document.getElementById("ussdHint");
    let sessionId = null;
    let path = [];
    let ended = true;

    async function call(text) {
      const body = {
        sessionId,
        phoneNumber: document.getElementById("phone").value,
        serviceCode: "*334#",
        text,
      };
      try {
        const res = await fetch(USSD_BASE + "/ussd", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        const reply = await res.text();
        if (!res.ok) throw new Error(reply || res.status);
        const isEnd = reply.startsWith("END");
        screen.textContent = reply.replace(/^(CON|END)\s/, "");
        ended = isEnd;
        keys.hidden = isEnd;
        hint.classList.add("hidden");
        if (isEnd) path = [];
        return reply;
      } catch (e) {
        screen.textContent = "Gateway unreachable.\nStart compose, then Dial again.";
        hint.className = "status-banner err";
        hint.classList.remove("hidden");
        hint.textContent = String(e.message || e);
        ended = true;
        keys.hidden = true;
        Finix.toast("USSD gateway offline", "err");
      }
    }

    document.getElementById("dial").onclick = async () => {
      sessionId = "web-" + crypto.randomUUID();
      path = [];
      buffer.value = "";
      await call("");
    };

    document.getElementById("reset").onclick = () => {
      sessionId = null;
      path = [];
      ended = true;
      keys.hidden = true;
      screen.textContent = "Session cleared.";
    };

    async function submitToken(token) {
      if (!sessionId || ended) return;
      if (token === "send") {
        const typed = buffer.value.trim();
        if (typed) path.push(typed);
        buffer.value = "";
      } else {
        path.push(token);
      }
      await call(path.join("*"));
    }

    keys.addEventListener("click", (ev) => {
      const k = ev.target.closest("[data-k]")?.getAttribute("data-k");
      if (k) submitToken(k);
    });
    buffer.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") submitToken("send");
    });
  </script>
</body>
</html>
