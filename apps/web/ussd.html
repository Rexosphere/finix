  <script src="/env.js"></script>
  <script src="/js/finix.js"></script>
  <script>
    Finix.bindMeshStatus("#meshStatus");
    const USSD_BASE = Finix.API.ussd();
    const screen = document.getElementById("screen");
    const keys = document.getElementById("keys");
    const buffer = document.getElementById("buffer");
    const hint = document.getElementById("ussdHint");
    let sessionId = null;
    let path = [];
    let ended = true;

    async function call(text) {
      const body = {
        sessionId,
        phoneNumber: document.getElementById("phone").value,
        serviceCode: "*334#",
        text,
      };
      try {
        const res = await fetch(USSD_BASE + "/ussd", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        const reply = await res.text();
        if (!res.ok) throw new Error(reply || res.status);
        const isEnd = reply.startsWith("END");
        screen.textContent = reply.replace(/^(CON|END)\s/, "");
        ended = isEnd;
        keys.hidden = isEnd;
        hint.classList.add("hidden");
        if (isEnd) path = [];
        return reply;
      } catch (e) {
        screen.textContent = "Gateway unreachable.\nStart compose, then Dial again.";
        hint.className = "status-banner err";
        hint.classList.remove("hidden");
        hint.textContent = String(e.message || e);
        ended = true;
        keys.hidden = true;
        Finix.toast("USSD gateway offline", "err");
      }
    }

    document.getElementById("dial").onclick = async () => {
      sessionId = "web-" + crypto.randomUUID();
      path = [];
      buffer.value = "";
      await call("");
    };

    document.getElementById("reset").onclick = () => {
      sessionId = null;
      path = [];
      ended = true;
      keys.hidden = true;
      screen.textContent = "Session cleared.";
    };

    async function submitToken(token) {
      if (!sessionId || ended) return;
      if (token === "send") {
        const typed = buffer.value.trim();
        if (typed) path.push(typed);
        buffer.value = "";
      } else {
        path.push(token);
      }
      await call(path.join("*"));
    }

    keys.addEventListener("click", (ev) => {
      const k = ev.target.closest("[data-k]")?.getAttribute("data-k");
      if (k) submitToken(k);
    });
    buffer.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") submitToken("send");
    });
  </script>
