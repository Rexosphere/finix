<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINIX Lite</title>
  <style>
    :root { --ink:#1a241c; --paper:#f3efe6; --moss:#1f6b45; --line:#cfc6b6; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 0% 0%, #dfe8d8 0%, transparent 55%),
        var(--paper);
      padding: 1.5rem;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 3rem);
      letter-spacing: 0.06em;
      margin: 0 0 0.35rem;
    }
    p { max-width: 28rem; line-height: 1.45; color: #3d4a40; }
    form {
      margin-top: 1.5rem;
      max-width: 22rem;
      display: grid;
      gap: 0.65rem;
    }
    label { font-size: 0.9rem; }
    input, button {
      font: inherit;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--line);
      background: #fff;
    }
    button {
      background: var(--moss);
      color: #f7fff8;
      border-color: var(--moss);
      cursor: pointer;
    }
    nav { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    a { color: var(--moss); }
    .hint { font-size: 0.85rem; color: #667066; }
    code { font-family: ui-monospace, monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>FINIX</h1>
  <p>Low-data balance check. No JavaScript. Under 50&nbsp;KB.</p>
  <form action="/lite/balance" method="get">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" inputmode="tel" placeholder="+94771110001" required />
    <button type="submit">Check balance</button>
  </form>
  <p class="hint">Demo phones: <code>+94771110001</code> farmer · <code>+94771110002</code> SME · <code>+94771110003</code> elder</p>
  <nav>
    <a href="/">PWA</a>
    <a href="/ussd.html">USSD *334#</a>
    <a href="/verify.html">Ledger verify</a>
  </nav>
</body>
</html>
