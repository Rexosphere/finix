<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINIX Lite</title>
  <style>
    :root {
      --bg:#0a1220; --ink:#e8edf8; --muted:#9eb0a8; --mint:#3dd68c;
      --panel:#0e1522; --line:#2f3d38; --btn:#0b9f6a; --on-btn:#041a12;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;padding:1.5rem;
      font-family:system-ui,sans-serif;color:var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%,rgba(11,159,106,.12),transparent 55%),
        radial-gradient(ellipse 40% 35% at 100% 100%,rgba(228,184,74,.05),transparent 50%),
        var(--bg);
    }
    h1{margin:0;font-size:clamp(2rem,8vw,2.75rem);letter-spacing:-.04em;font-weight:700;color:var(--mint)}
    p{max-width:28rem;line-height:1.5;color:var(--muted)}
    form{margin-top:1.5rem;max-width:22rem;display:grid;gap:.65rem;padding:1.1rem;background:var(--panel);border:1px solid color-mix(in srgb,var(--mint) 22%,transparent);border-radius:.5rem}
    label{font-size:.78rem;color:var(--muted);font-family:ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
    input,button{font:inherit;padding:.7rem .8rem;border:1px solid var(--line);background:#101826;color:var(--ink);min-height:48px;border-radius:.4rem}
    input:focus{outline:2px solid color-mix(in srgb,var(--mint) 40%,transparent);border-color:var(--mint)}
    button{background:var(--btn);color:var(--on-btn);border-color:var(--btn);font-weight:700;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem}
    nav{margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap}
    a{color:var(--mint)}
    .hint{font-size:.85rem}
    code{font-family:ui-monospace,monospace;font-size:.85rem;color:var(--mint)}
    .foot{margin-top:2.5rem;font-family:ui-monospace,monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  </style>
</head>
<body>
  <h1>FINIX</h1>
  <p>Low-data balance check. No JavaScript. Under 50&nbsp;KB.</p>
  <form action="/lite/balance" method="get">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" inputmode="tel" placeholder="+94771110001" required />
    <button type="submit">Check balance</button>
  </form>
  <p class="hint">Demo phones: <code>+94771110001</code> farmer · <code>+94771110002</code> SME · <code>+94771110003</code> elder</p>
  <nav>
    <a href="/">Identity</a>
    <a href="/ussd.html">USSD *334#</a>
    <a href="/verify.html">Ledger verify</a>
  </nav>
  <p class="foot">FINIX Mesh · resilient fabric</p>
</body>
</html>
