<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3dd68c" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>FINIX — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1c18;
      --paper: #e8f0ea;
      --panel: #102820;
      --mint: #3dd68c;
      --amber: #e8b84a;
      --danger: #e85d5d;
      --muted: #8aa396;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--paper);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1a4a38 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #143028 0%, transparent 50%),
        var(--ink);
    }
    main { max-width: 920px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 .35rem; letter-spacing: -.03em; }
    .brand { color: var(--mint); }
    .lede { color: var(--muted); max-width: 36rem; line-height: 1.5; margin-bottom: 1.5rem; }
    nav { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
    nav a { color: var(--mint); text-decoration: none; font-size: .95rem; }
    .row { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    label { display: grid; gap: .35rem; font-size: .85rem; color: var(--muted); }
    select, input, button, textarea {
      font: inherit;
      padding: .65rem .75rem;
      border: 1px solid color-mix(in srgb, var(--mint) 30%, transparent);
      background: color-mix(in srgb, var(--panel) 92%, black);
      color: var(--paper);
      border-radius: 0;
    }
    button {
      background: var(--mint);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      border-color: var(--mint);
    }
    button.secondary { background: transparent; color: var(--mint); }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .panel {
      background: color-mix(in srgb, var(--panel) 90%, black);
      border: 1px solid color-mix(in srgb, var(--mint) 20%, transparent);
      padding: 1rem;
      margin-top: 1rem;
    }
    .status { font-family: "JetBrains Mono", monospace; font-size: .8rem; color: var(--amber); }
    .code {
      font-family: "JetBrains Mono", monospace;
      font-size: .72rem;
      word-break: break-all;
      color: var(--mint);
      max-height: 8rem;
      overflow: auto;
    }
    .outbox { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
    .outbox li {
      display: flex; justify-content: space-between; gap: 1rem; align-items: baseline;
      border-bottom: 1px solid color-mix(in srgb, var(--mint) 15%, transparent);
      padding: .4rem 0;
      font-size: .9rem;
    }
    .pill { font-family: "JetBrains Mono", monospace; font-size: .75rem; color: var(--amber); }
    .online::before { content: ""; display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--mint); margin-right: .4rem; }
    .offline::before { background: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1><span class="brand">FINIX</span></h1>
    <p class="lede">Create a signed offline voucher on-device, hand the Base45 payload as a QR, then reconcile when back online. Double-spend reuses are quarantined.</p>
    <nav>
      <a href="/ussd.html">USSD *334#</a>
      <a href="/lite.html">Lite</a>
      <a href="/verify.html">Ledger verify</a>
      <a href="http://localhost:3001/" rel="noreferrer">Ceremony admin</a>
    </nav>
    <p class="status" id="net"><span class="online">checking…</span></p>

    <div class="row">
      <label>Payer
        <select id="payer">
          <option value="farmer">Farmer · FINIX-SAV-00000001</option>
          <option value="elder">Elder · FINIX-SAV-00000003</option>
        </select>
      </label>
      <label>Payee
        <select id="payee">
          <option value="sme">SME · FINIX-CUR-00000002</option>
          <option value="elder">Elder · FINIX-SAV-00000003</option>
          <option value="farmer">Farmer · FINIX-SAV-00000001</option>
        </select>
      </label>
      <label>Amount (LKR)
        <input id="amount" type="number" min="1" step="0.01" value="250.00" />
      </label>
    </div>
    <div class="row" style="margin-top:1rem">
      <button id="create" type="button">Sign offline voucher</button>
      <button id="sync" class="secondary" type="button">Reconcile outbox</button>
      <button id="doublespend" class="danger" type="button">Replay last (double-spend demo)</button>
    </div>

    <section class="panel">
      <h2 style="margin:0 0 .5rem;font-size:1rem">Latest voucher</h2>
      <p id="latestMeta" class="status">None yet</p>
      <p class="code" id="latestCode"></p>
    </section>

    <section class="panel">
      <h2 style="margin:0 0 .5rem;font-size:1rem">Outbox</h2>
      <ul class="outbox" id="outbox"></ul>
    </section>
  </main>
  <script src="/js/offline.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const net = $("net");
    function paintNet() {
      net.innerHTML = navigator.onLine
        ? '<span class="online">online — reconcile available</span>'
        : '<span class="offline">offline — vouchers queue locally</span>';
    }
    window.addEventListener("online", paintNet);
    window.addEventListener("offline", paintNet);
    paintNet();

    let lastVoucher = null;

    async function refreshOutbox() {
      const items = await FinixOffline.listOutbox();
      $("outbox").innerHTML = items
        .sort((a, b) => b.createdAt - a.createdAt)
        .map((v) => `<li><span>#${v.deviceSeq} · LKR ${(v.amountMinor / 100).toFixed(2)} → ${v.payeeAccountId.slice(0, 8)}…</span><span class="pill">${v.status}</span></li>`)
        .join("") || "<li>Empty</li>";
    }

    $("create").onclick = async () => {
      const payer = FinixOffline.DEMO[$("payer").value];
      const payee = FinixOffline.DEMO[$("payee").value];
      if (payer.accountId === payee.accountId) {
        alert("Pick different payer and payee");
        return;
      }
      lastVoucher = await FinixOffline.createVoucher({
        payer,
        payee,
        amountLkr: $("amount").value,
        hoursValid: 24,
      });
      $("latestMeta").textContent = `seq ${lastVoucher.deviceSeq} · ${lastVoucher.status} · device ${lastVoucher.deviceId}`;
      $("latestCode").textContent = lastVoucher.base45;
      await refreshOutbox();
      if ("serviceWorker" in navigator && "SyncManager" in window) {
        const reg = await navigator.serviceWorker.ready;
        try { await reg.sync.register("finix-offline-reconcile"); } catch (_) {}
      }
    };

    $("sync").onclick = async () => {
      try {
        const results = await FinixOffline.reconcileAll();
        $("latestMeta").textContent = `reconciled ${results.length} item(s)`;
      } catch (e) {
        $("latestMeta").textContent = String(e);
      }
      await refreshOutbox();
    };

    $("doublespend").onclick = async () => {
      if (!lastVoucher) {
        alert("Create a voucher first");
        return;
      }
      const clone = { ...lastVoucher, id: crypto.randomUUID(), status: "queued", createdAt: Date.now() };
      // Force same nonce + seq into a fresh outbox row for the demo.
      const dbOpen = indexedDB.open("finix-offline", 1);
      dbOpen.onsuccess = () => {
        const tx = dbOpen.result.transaction("outbox", "readwrite");
        tx.objectStore("outbox").put(clone);
        tx.oncomplete = async () => {
          await refreshOutbox();
          try {
            await FinixOffline.reconcileVoucher(clone);
            $("latestMeta").textContent = "unexpected success";
          } catch (e) {
            $("latestMeta").textContent = "double-spend caught — " + String(e).slice(0, 180);
          }
          await refreshOutbox();
        };
      };
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
      navigator.serviceWorker.addEventListener("message", (ev) => {
        if (ev.data?.type === "reconcile") FinixOffline.reconcileAll().then(refreshOutbox);
      });
    }
    refreshOutbox();
  </script>
</body>
</html>
