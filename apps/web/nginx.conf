server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Without an explicit resolver, nginx resolves each
  # upstream name once at startup and caches that address for the life of the
  # process. A deploy that recreates a backend gives it a new container IP,
  # and this proxy keeps dialling the old one — which by then may belong to an
  # entirely different container — until nginx itself is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Passing the upstream through a variable defers resolution to request time,
  # which is the whole point of the resolver above. It also switches off
  # nginx's implicit "strip the matched prefix" rewriting, so each location
  # captures the remainder of the path and appends it explicitly.
  location ~ ^/api/account/(.*)$ {
    set $upstream_account http://account-service:8083;
    proxy_pass $upstream_account/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/orchestrator/(.*)$ {
    set $upstream_orchestrator http://transaction-orchestrator:8085;
    proxy_pass $upstream_orchestrator/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/ledger/(.*)$ {
    set $upstream_ledger http://ledger-service:8084;
    proxy_pass $upstream_ledger/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/ussd/(.*)$ {
    set $upstream_ussd http://ussd-gateway:8087;
    proxy_pass $upstream_ussd/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/lite/balance(.*)$ {
    set $upstream_ussd_lite http://ussd-gateway:8087;
    proxy_pass $upstream_ussd_lite/lite/balance$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Cross-app links are the one thing a prebuilt image cannot know: the customer
  # app and the ops console sit on different origins in every environment. This
  # file is mounted as an nginx template and envsubst'd at container start, so
  # the URLs come from the deploy environment rather than from a sed over
  # tracked HTML. Defaults keep `make demo` working unchanged.
  location = /env.js {
    default_type application/javascript;
    add_header Cache-Control "no-store";
    return 200 'window.FINIX_LINKS={web:"${FINIX_WEB_URL}",admin:"${FINIX_ADMIN_URL}"};';
  }

  # Assets are not content-hashed, so a long max-age lets a deploy serve fresh
  # HTML against a stale /js/finix.js. `no-cache` still caches; it just
  # revalidates against the ETag first, so the usual answer is a 304.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
